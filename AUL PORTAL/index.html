<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUL Portal - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">
        <div class="logo-section">
            <!-- Placeholder for the logo image -->
            <img src="./img/anchor_logo.png" alt="Anchor University Lagos" class="logo">
            <div class="logo-text">ANCHOR UNIVERSITY</div>
            <div class="sub-logo-text">LAGOS</div>
        </div>

        <h2>AUL Login</h2>

        <form>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password">
            </div>

            <div class="actions">
                <button type="button" class="btn-login">Login</button>
                <a href="#" class="forgot-password">Lost your password?</a>
            </div>
        </form>

        <div class="footer">
            <div class="footer-logo">
                <i class="fas fa-anchor"></i> Anchor University, Lagos
            </div>
            <div class="footer-year">2025</div>
        </div>
    </div>

</body>

</html>
